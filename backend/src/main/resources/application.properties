cspring.application.name=employee-management
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5174}
logging.level.com.example.ems=INFO

# Set JWT_SECRET to a random 32+ byte secret in your environment before running.
app.jwt.secret=MyEmployeeManagementSecretKey2026ForJWTAuthentication123456
app.jwt.expiration-seconds=3600

# Gmail SMTP credentials must be supplied by the environment.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false
app.mail.login-alert-enabled=true
