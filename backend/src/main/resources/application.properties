spring.application.name=employee-management
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5174}
logging.level.com.example.ems=INFO
