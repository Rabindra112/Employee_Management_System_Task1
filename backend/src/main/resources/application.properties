spring.application.name=employee-management
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5174}
logging.level.com.example.ems=INFO

# Set JWT_SECRET to a random 32+ byte secret in your environment before running.
app.jwt.secret=mysecretkeymysecretkeymysecretkey
app.jwt.expiration-seconds=3600

# Gmail SMTP credentials must be supplied by the environment.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false
app.mail.login-alert-enabled=true


# RSA Encryption Configuration
app.rsa.private-key-path=${RSA_PRIVATE_KEY_PATH:C:/Users/III S I/Desktop/Employee_Management_System_Task1/secrets/private_key.pem}
app.rsa.public-key-path=${RSA_PUBLIC_KEY_PATH:C:/Users/III S I/Desktop/Employee_Management_System_Task1/secrets/public_key.pem}
# =========================================
# DOCUMENT MANAGEMENT CONFIGURATION
# =========================================

# Maximum upload size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Document storage directory
app.document.storage-path=${DOCUMENT_STORAGE_PATH:./document-storage}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
